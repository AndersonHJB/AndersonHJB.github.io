name: 部署文档

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: site-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
          cache: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建文档
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |-
          pnpm exec vuepress-vite build docs
          touch docs/.vuepress/dist/.nojekyll

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/.vuepress/dist
